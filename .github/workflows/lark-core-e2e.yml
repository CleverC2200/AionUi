name: 'Lark Core Boundary E2E'

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/lark-core-e2e.yml'
      - 'packages/desktop/src/**'
      - 'packages/web-host/**'
      - 'tests/e2e/features/auth/**'
      - 'tests/e2e/helpers/mock-gea-lark-server.ts'
      - 'justfile'

concurrency:
  group: lark-core-e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AIONCORE_LARK_E2E_REF: e7d991360d6dd0d4a7b6472606c7a512b0bfdffc
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'
  CARGO_INCREMENTAL: '0'
  NODE_OPTIONS: '--max-old-space-size=8192'

jobs:
  lark-core-boundary:
    name: Real Core + macOS safeStorage
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout AionUi
        uses: actions/checkout@v4

      - name: Checkout pinned AionCore boundary
        uses: actions/checkout@v4
        with:
          repository: CleverC2200/AionCore
          ref: ${{ env.AIONCORE_LARK_E2E_REF }}
          path: .aioncore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Install AionUi dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: npm run postinstall || true

      - name: Build pinned AionCore
        working-directory: .aioncore
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/aioncore-target
        run: cargo build --locked --bin aioncore --features test-support

      - name: Run Lark-to-Core boundary tests
        env:
          AIONUI_AIONCORE_BINARY: ${{ runner.temp }}/aioncore-target/debug/aioncore
        run: just test-lark-core-boundary
